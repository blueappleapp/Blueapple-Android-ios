
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>BlueApple Supermarket App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      color: #243746;
      background: #f7f9fa;
    }
    .container {
      max-width: 420px;
      margin: 40px auto;
      padding: 28px 20px;
      background: white;
      border-radius: 16px;
    }
    h1 { color: #6f8fa3; }
    p { line-height: 1.8; }
    .btn {
      display: block;
      margin: 16px 0;
      padding: 15px;
      border-radius: 9px;
      background: #6f8fa3;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    .secondary {
      background: #263746;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>BlueApple Supermarket</h1>
    <p>حمّل تطبيق BlueApple واستمتع بتجربة تسوق أسهل.</p>

    <a class="btn"
       href="https://play.google.com/store/apps/details?id=com.Linktsp.BlueAppleMarket">
      تحميل التطبيق للأندرويد
    </a>

    <a class="btn secondary"
       href="https://apps.apple.com/app/id6503000547">
      تحميل التطبيق للآيفون والآيباد
    </a>

    <p>
      <a href="https://www.facebook.com/blueapplemarket">
        تابعنا على Facebook
      </a>
    </p>
  </main>
</body>
</html>
